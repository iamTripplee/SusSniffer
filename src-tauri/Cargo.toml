[package]
name = "sussniffer"
version = "0.2.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-notification = "2.7.0"
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = "2.5.4"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_Security_WinTrust", "Win32_UI_Shell", "Win32_System_SystemInformation", "Win32_Security_Cryptography", "Win32_System_Performance", "Win32_Graphics_Dxgi", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell_Common", "Win32_System_Environment"] }
winreg = "0.56.0"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
strip = true

